<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Consensus Weather</title>
<meta name="theme-color" content="#0a0f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consensus Weather">
<link rel="apple-touch-icon" href="emblem.png">
<link rel="icon" href="emblem.png">
<style>
  :root{
    --rounded: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, Roboto, sans-serif;
    --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.84); --ink-mute:rgba(255,255,255,.62);
    --card:rgba(14,18,38,.34); --temp:#FF9E5A; --feels:#B49CFF; --rain:#7CC4F5;
    --line:rgba(255,255,255,.16); --shadow:0 22px 48px -18px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--rounded);color:var(--ink);
    background:linear-gradient(180deg,#0a0f26 0%,#161d47 55%,#282c5e 100%);background-attachment:fixed;background-size:cover;
    min-height:100vh;padding:0 14px 90px;-webkit-font-smoothing:antialiased;transition:background .8s ease}
  .wrap{max-width:600px;margin:0 auto}
  .applogo{display:flex;align-items:center;justify-content:center;gap:12px;padding:0;cursor:pointer}
  .logo-badge.spin{animation:logospin .7s cubic-bezier(.4,0,.2,1)}
  @keyframes logospin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .logo-row{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;padding:0 0 8px}
  .hhbtn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .hhbtn:active{background:rgba(255,255,255,.24)}
  .hhbtn.off{color:rgba(255,255,255,.5)}
  .hhi{width:20px;height:20px;display:block}
  .ic{display:inline-block;vertical-align:middle;flex:0 0 auto}
  .logo-badge{width:46px;height:46px;border-radius:13px;object-fit:cover;box-shadow:0 8px 18px -8px rgba(0,0,0,.55)}
  .logo-word{display:flex;flex-direction:column;line-height:1.04}
  .lw1{font-size:21px;font-weight:800;letter-spacing:.2px;background:linear-gradient(90deg,#FFB020,#E4657F);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .lw2{font-size:16px;font-weight:600;letter-spacing:.2px;background:linear-gradient(90deg,#8FD0FF,#4E7FC7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

  /* location tiles: 2 side slots + center (current) */
  .tiles{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px;align-items:stretch;margin:2px 0 14px}
  .tile{position:relative;border-radius:20px;padding:14px 10px;min-height:76px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;text-align:center;
    background:var(--card);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 26px -16px rgba(0,0,0,.55)}
  .tile.center{background:linear-gradient(135deg,#8B5CC7,#E4657F);color:#fff;box-shadow:0 16px 34px -14px rgba(139,92,199,.7);border:none}
  .tile .tile-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.85;margin-bottom:3px}
  .tile .tile-city{font-size:15px;font-weight:800;line-height:1.15}
  .tile.center .tile-city{font-size:18px}
  .tile .tile-sub{font-size:10px;font-weight:700;color:var(--ink-mute);margin-top:3px}
  .tile.center .tile-sub{color:rgba(255,255,255,.82)}
  .tile.empty{color:var(--feels);border-style:dashed;border-color:rgba(124,92,255,.45)}
  .tile .plus{font-size:26px;font-weight:800;line-height:1}
  .tile-edit,.tile-clear{position:absolute;top:6px;width:22px;height:22px;border:none;border-radius:50%;font-family:inherit;font-size:11px;font-weight:900;cursor:pointer;line-height:1;padding:0}
  .tile-edit{right:6px;background:rgba(124,92,255,.16);color:var(--feels)}
  .tile-clear{left:6px;background:rgba(228,101,127,.16);color:#E4657F}
  .tile-gps{position:absolute;top:6px;left:6px;width:24px;height:24px;border:none;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:12px;cursor:pointer;line-height:1;padding:0}
  /* revolving centered location bar */
  .locbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 0 4px}
  .locnow{flex:0 1 auto;border:1px solid rgba(255,255,255,.18);background:var(--card);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);color:#fff;font-family:inherit;font-weight:800;font-size:15px;padding:10px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);overflow:hidden;text-overflow:ellipsis;max-width:56%}
  .locnow .cev{opacity:.7;font-size:12px;margin-left:5px}
  .locside{flex:0 1 auto;max-width:24%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:none;background:transparent;color:var(--ink-mute);font-family:inherit;font-weight:800;font-size:12px;padding:6px 4px;cursor:pointer;opacity:.75}
  /* manage-locations list (in popup) */
  .loclist{margin-bottom:14px}
  .locitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;cursor:pointer;font-weight:800;color:var(--ink)}
  .locitem.on{background:rgba(167,139,255,.16)}
  .locitem em{font-size:11px;font-weight:800;color:var(--ink-mute);font-style:normal}
  .lrem{border:none;background:rgba(228,101,127,.18);color:#E4657F;font-family:inherit;font-weight:800;font-size:12px;padding:6px 12px;border-radius:12px;cursor:pointer}
  .addhdr{font-size:12px;font-weight:800;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 8px}

  /* search sheet */
  .sheet{display:none;position:fixed;inset:0;z-index:50;background:rgba(8,10,25,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:flex-start;justify-content:center;padding:60px 16px}
  .sheet.open{display:flex}
  .sheet-card{background:rgba(22,26,48,.72);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);width:100%;max-width:440px;border-radius:30px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.16)}
  .sheet-card h3{margin:2px 0 12px;font-size:18px;font-weight:800;color:var(--ink)}
  .searchrow{display:flex;gap:8px}
  #q{flex:1;font-family:inherit;font-size:16px;font-weight:700;padding:13px 15px;border:2px solid var(--line);border-radius:15px;outline:none;background:rgba(255,255,255,.06);color:var(--ink)}
  #q::placeholder{color:var(--ink-mute)}
  #q:focus{border-color:var(--feels)}
  .gobtn{border:none;background:var(--feels);color:#fff;font-family:inherit;font-weight:800;font-size:15px;padding:0 18px;border-radius:15px;cursor:pointer}
  .myloc{width:100%;margin-top:12px;border:none;border-radius:15px;padding:13px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;background:rgba(167,139,255,.16);color:var(--feels)}
  .results{margin-top:12px;max-height:46vh;overflow:auto}
  .res{padding:12px 14px;border-radius:14px;cursor:pointer;font-weight:700;color:var(--ink)}
  .res:hover{background:rgba(255,255,255,.06)}
  .res b{font-weight:800}.res small{display:block;color:var(--ink-mute);font-weight:700;font-size:12px}
  .closex{float:right;border:none;background:rgba(255,255,255,.10);color:var(--ink-soft);font-weight:900;border-radius:10px;padding:6px 11px;cursor:pointer;font-family:inherit}

  /* hero — glass panel that runs to the very top of the screen */
  .hero-wrap{position:relative;margin:0 -14px}
  .hero-wrap::before{content:'';position:absolute;left:20px;right:20px;top:26px;bottom:-12px;border-radius:52px;background:linear-gradient(180deg,rgba(8,10,26,.10) 0%,rgba(8,10,26,.42) 100%);filter:blur(1px);z-index:0;transition:opacity .45s ease,transform .45s cubic-bezier(.22,.7,.25,1)}
  .hero{position:relative;z-index:1;border-radius:0 0 66px 66px;padding:max(16px,var(--sat,env(safe-area-inset-top))) 18px 18px;color:#fff;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .src-wrap{position:relative;margin:40px -14px -90px}
  .src-wrap::before{content:'';position:absolute;left:20px;right:20px;top:-12px;bottom:26px;border-radius:52px;background:linear-gradient(0deg,rgba(8,10,26,.10) 0%,rgba(8,10,26,.42) 100%);filter:blur(1px);z-index:0}
  .src-hero{position:relative;z-index:1;border-radius:66px 66px 0 0;padding:30px 18px calc(34px + env(safe-area-inset-bottom));color:#fff;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .src-hero .src-table,.src-hero .note{background:transparent;box-shadow:none;border:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .src-hero .note{padding:0;margin-top:12px}
  .foot-in{text-align:center;font-size:11px;font-weight:700;color:var(--ink-mute);margin-top:16px}
  .bottom-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;opacity:.9}
  .foot:empty{display:none}
  .hero .glow{position:absolute;inset:0;background:radial-gradient(520px 260px at 80% 10%,rgba(255,255,255,.22),rgba(255,255,255,0) 60%);pointer-events:none}
  .hero-head{position:relative;z-index:2}
  .hero-divider{height:1px;background:var(--line);margin:8px 0 2px;position:relative;z-index:2}
  .hero-body{position:relative;z-index:2;cursor:pointer;padding-top:8px}
  .hero-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;position:relative;z-index:2}
  .loc{justify-self:center;text-align:center}
  .loc small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-bottom:2px}
  .locname{display:block;font-size:18px;font-weight:800;line-height:1.15}
  .live-pill{justify-self:start;display:inline-flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.18);border-radius:14px;padding:3px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-align:center;white-space:nowrap}
  .live-pill .lp1{font-size:9px;font-weight:800;padding:2px 8px 1px;letter-spacing:.1px;opacity:.92}
  .live-pill .lp2{font-size:11px;font-weight:800;padding:2px 10px;border-radius:11px;background:rgba(255,255,255,.9);color:#3a2e6e}
  .hero-top .unit-toggle{justify-self:end}
  .hero-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin-top:10px;position:relative;z-index:2}
  .hero-set{display:flex;align-items:center;justify-content:center}
  .hero-pict{flex:0 0 auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.28))}
  .hero-sub{text-align:center;margin-top:-4px}
  .now-temp{font-size:96px;font-weight:800;line-height:.9;letter-spacing:-2px;text-shadow:0 6px 22px rgba(0,0,0,.3);margin-left:-28px;position:relative;z-index:1}
  .now-temp span{font-size:39px;vertical-align:top;opacity:.85}
  .now-cond{font-size:18px;font-weight:800}
  .now-feels{font-size:13px;font-weight:700;opacity:.9;margin-top:1px}
  .lohi-row{display:flex;justify-content:center;gap:8px;margin-top:12px;position:relative;z-index:2}
  .lohi{flex:0 0 auto;width:140px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(255,255,255,.13);border-radius:12px;padding:6px 14px;font-size:12px;font-weight:800}
  .hero-stats{display:flex;justify-content:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.16);position:relative;z-index:2}
  .hs{flex:1 1 0;text-align:center;min-width:0}
  .hs span{font-size:16px;display:block}
  .hs span .ic3{margin:0 auto 1px}
  .ic3{display:block}
  .hs b{font-size:15px;font-weight:800;display:flex;align-items:baseline;justify-content:center;gap:1px;margin-top:2px;white-space:nowrap}
  .hs .ptr{font-size:11px;font-weight:900;margin-left:2px;vertical-align:1px}
  .hs .ptr.up{color:#7CE0A0}
  .hs .ptr.down{color:#FF9B8A}
  .hs i{font-size:10px;font-weight:700;opacity:.72;font-style:normal;text-transform:uppercase;letter-spacing:.4px}
  .hero-panel{width:auto;max-width:none;margin:14px 26px 0;padding:14px 0;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);position:relative;z-index:2}
  .hero-panel .lohi-row{margin-top:0}

  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
  .stat{background:var(--card);border-radius:18px;padding:13px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat .k{font-size:10px;font-weight:800;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:19px;font-weight:800;margin-top:4px}.stat .u{font-size:10px;font-weight:700;color:var(--ink-soft)}

  h2{font-size:20px;font-weight:800;margin:28px 0 4px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
  .sub{font-size:12px;font-weight:400;color:var(--ink-soft);margin:0 0 12px;text-align:center}

  .strip-wrap{background:var(--card);border-radius:28px;padding:6px 4px 12px;box-shadow:var(--shadow);overflow-x:auto;margin-top:22px}
  .strip{display:flex;gap:2px;padding:8px 0;margin:28px -14px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .hcell.past{opacity:.4}
  .hcell{flex:0 0 auto;width:64px;text-align:center;padding:10px 3px;border-radius:20px;background:rgba(22,27,51,.39)}
  .hcell.night{background:linear-gradient(180deg,rgba(3,5,14,.66),rgba(3,5,14,.5))}
  .hcell.newday{position:relative}
  .hcell.newday::before{content:attr(data-day);position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--feels);background:#F0EAFF;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .hcell .ht{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:5px}
  .hcell .hday{font-size:10px;font-weight:800;color:var(--ink-mute);letter-spacing:.3px;margin-bottom:1px}
  .hcell.daystart{border-left:2px solid rgba(167,139,255,.5);margin-left:3px;padding-left:5px}
  .hcell.daystart .hday{color:var(--feels)}
  .hcell .htemp{font-size:16px;font-weight:800;margin-top:5px}
  .hcell .hfeels{font-size:10px;font-weight:700;color:var(--feels);margin-top:1px}
  .hcell .hrain{font-size:9px;font-weight:800;color:var(--rain);margin-top:3px;min-height:12px}
  .hcell .hmm{font-size:9px;font-weight:800;color:#6FA8DC;margin-top:1px;min-height:11px}
  .hcell.now{background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 22px -12px rgba(0,0,0,.5)}
  .hcell.now .ht,.hcell.now .hday,.hcell.now .htemp{color:#1a1730}
  .hcell.now .hfeels{color:#5a3fb0}
  .hcell.now .hrain,.hcell.now .hmm{color:#2f6db0}
  .pico{display:block;margin:0 auto}

  .card{background:var(--card);border-radius:28px;padding:16px;box-shadow:var(--shadow)}
  .hero,.card,.strip-wrap,.days,.src-table,.seg,.stat,.note,.src-hero{backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.16)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:4px}
  .lg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
  .dot{width:13px;height:13px;border-radius:5px}
  .chart-box{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .chart-box svg{display:block}

  .segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  #partSheet .seg{background:var(--card);border-radius:22px;padding:13px 16px 14px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .seg .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
  .seg-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .seg-name{font-size:15px;font-weight:800}.seg-time{font-size:11px;font-weight:700;color:var(--ink-mute)}
  .seg-body{display:flex;align-items:center;gap:12px;margin-top:8px}
  .seg-temp{font-size:31px;font-weight:800;line-height:1}.seg-temp small{font-size:13px;color:var(--ink-soft);font-weight:800}
  .seg-feels{font-size:12px;font-weight:800;color:var(--feels)}
  .seg-desc{font-size:12px;font-weight:600;color:var(--ink-soft);line-height:1.5;margin-top:8px}

  /* 7-day */
  .days{background:var(--card);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
  .drow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
  .drow:first-child{border-top:none}
  .dname{width:52px;font-weight:800;font-size:14px}
  .dname small{display:block;font-weight:700;font-size:11px;color:var(--ink-mute)}
  .drain{width:44px;font-size:11px;font-weight:800;color:var(--rain);text-align:center}
  .dtrack{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.12);position:relative}
  .dfill{position:absolute;height:100%;border-radius:999px;background:linear-gradient(90deg,#6FC3F5,#FFC24B,#FF8A3D)}
  .dlo{width:34px;text-align:right;font-weight:800;color:var(--ink-mute);font-size:13px}
  .dhi{width:34px;font-weight:800;font-size:14px}

  .src-table{background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:11px 14px;text-align:left}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-mute);font-weight:800;background:rgba(255,255,255,.05)}
  td{border-top:1px solid var(--line);font-weight:700}
  tr.avg td{background:rgba(255,158,90,.14);border-top:2px solid var(--temp)}
  tr.avg td:first-child{color:var(--temp)}

  .note{font-size:12px;font-weight:600;color:var(--ink-soft);line-height:1.6;margin-top:14px;background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:0 10px 24px -18px rgba(60,40,110,.4)}
  .foot{text-align:center;font-size:11px;font-weight:700;color:var(--ink-mute);margin-top:18px}
  .loading{text-align:center;padding:calc(var(--sat,env(safe-area-inset-top)) + 60px) 40px 40px;font-weight:800;color:var(--ink-soft)}
  .spin{display:inline-block;width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--feels);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes appFromRight{from{transform:translate3d(38px,0,0)}to{transform:translate3d(0,0,0)}}
  @keyframes appFromLeft{from{transform:translate3d(-38px,0,0)}to{transform:translate3d(0,0,0)}}
  @keyframes appSettle{from{transform:translate3d(0,8px,0)}to{transform:translate3d(0,0,0)}}
  #app{backface-visibility:hidden}
  body{overflow-x:hidden}
  #stage{position:relative}
  #app{position:relative;z-index:1}
  .appghost{position:absolute;top:0;left:0;right:0;z-index:2;backface-visibility:hidden}
  #app.snap,.appghost.snap{transition:transform .34s cubic-bezier(.22,.7,.25,1)}
  #app.dragging,.appghost.dragging{will-change:transform}
  /* suspend expensive backdrop-blur while panels are in motion — keeps the swipe buttery */
  .nb .hero,.nb .card,.nb .strip-wrap,.nb .days,.nb .src-table,.nb .seg,.nb .stat,.nb .note,.nb .src-hero{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  /* hide the hero's faux drop-shadow during a swipe, then roll it back down once settled */
  .ns .hero-wrap::before{opacity:0;transform:translateY(-8px)}
  #app.app-next{animation:appFromRight .46s cubic-bezier(.16,.84,.3,1)}
  #app.app-prev{animation:appFromLeft .46s cubic-bezier(.16,.84,.3,1)}
  #app.app-fade{animation:appSettle .32s cubic-bezier(.16,.84,.3,1)}
  @media (prefers-reduced-motion:reduce){#app.app-next,#app.app-prev,#app.app-fade{animation:none}}
  @keyframes drift{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
  @keyframes fall{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(6px);opacity:0}}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}

<script>
/* ============ PICTOGRAMS ============ */
function pico(key,size){size=size||34;
  const night=key.indexOf('-night')>=0, base=key.replace('-day','').replace('-night','');
  const rays=`<g class="p-rays">${[0,45,90,135,180,225,270,315].map(a=>`<rect x="49.5" y="4" width="5" height="13" rx="2.5" fill="#FFC24B" transform="rotate(${a} 52 50)"/>`).join('')}</g>`;
  const sun=`<g filter="url(#softsh)">${rays}<circle cx="52" cy="50" r="20" fill="url(#gSun)"/><ellipse cx="45" cy="42" rx="8.5" ry="5.5" fill="#FFF7D6" opacity=".5"/></g>`;
  const cloud=(dk,x,y,s)=>`<g class="p-cloud" filter="url(#softsh)" transform="translate(${x} ${y}) scale(${s})"><path d="M26 66 a20 20 0 0 1 3-40 a24 24 0 0 1 47 6 a16 16 0 0 1 -4 34 Z" fill="url(#${dk?'gCloudDk':'gCloud'})"/><ellipse cx="40" cy="35" rx="15" ry="8" fill="#fff" opacity=".45"/></g>`;
  const moon=`<g class="p-moon" filter="url(#softsh)"><circle cx="54" cy="50" r="21" fill="url(#gMoon)"/><circle cx="61" cy="44" r="3.6" fill="#E0BC6E" opacity=".5"/><circle cx="47" cy="58" r="2.8" fill="#E0BC6E" opacity=".45"/><circle cx="59" cy="61" r="2.2" fill="#E0BC6E" opacity=".4"/></g>`;
  const moonBehind=`<g transform="translate(30 -10) scale(.56)">${moon}</g>`;
  const stars=`<circle class="p-star" cx="24" cy="26" r="2.6" fill="#FFF7D6"/><circle class="p-star s2" cx="82" cy="22" r="2" fill="#FFF7D6"/><circle class="p-star s3" cx="28" cy="64" r="1.8" fill="#FFF7D6"/>`;
  const drops=`<g>${[[40,74],[54,76],[68,74]].map((p,i)=>`<path class="p-drop ${i==1?'d2':i==2?'d3':''}" d="M${p[0]} ${p[1]} q3.5 5 0 9.5 q-3.5 -4.5 0 -9.5 Z" fill="url(#gDrop)"/>`).join('')}</g>`;
  const flake=(x,y,c)=>`<g class="p-drop ${c}" stroke="#eaf4ff" stroke-width="2.1" stroke-linecap="round"><line x1="${x-5}" y1="${y}" x2="${x+5}" y2="${y}"/><line x1="${x}" y1="${y-5}" x2="${x}" y2="${y+5}"/><line x1="${x-3.6}" y1="${y-3.6}" x2="${x+3.6}" y2="${y+3.6}"/><line x1="${x-3.6}" y1="${y+3.6}" x2="${x+3.6}" y2="${y-3.6}"/></g>`;
  const flakes=flake(40,78,'')+flake(55,82,'d2')+flake(70,78,'d3');
  const bolt=`<path class="p-moon" filter="url(#softsh)" d="M55 60 l-13 20 h9 l-4 16 17 -24 h-10 l6 -12 Z" fill="url(#gBolt)"/>`;
  const fogLines=`<g>${[80,88,96].map((y,i)=>`<line x1="18" y1="${y}" x2="86" y2="${y}" stroke="#eef3fb" stroke-width="4" stroke-linecap="round" opacity="${.85-i*.22}"/>`).join('')}</g>`;
  const mb=night?moonBehind:'';
  let s='';
  switch(base){
    case 'clear':s=night?stars+moon:sun;break;
    case 'pcloudy':s=night?stars+moonBehind+cloud(false,8,22,1):`<g transform="translate(-10 -12) scale(.78)">${sun}</g>`+cloud(false,8,20,1.02);break;
    case 'cloudy':s=mb+cloud(false,0,6,1.26);break;
    case 'overcast':s=mb+cloud(true,2,2,1.3);break;
    case 'fog':s=mb+cloud(false,0,-2,1.22)+fogLines;break;
    case 'rain':s=mb+cloud(true,0,-4,1.2)+drops;break;
    case 'snow':s=mb+cloud(true,0,-4,1.2)+flakes;break;
    case 'thunder':s=mb+cloud(true,0,-6,1.24)+bolt;break;
    default:s=sun;
  }
  return `<svg class="pico" style="width:${size}px;height:${size}px" viewBox="0 0 104 104" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}
function LB(key){var b=key.replace('-day','').replace('-night','');if(b==='clear')return key.indexOf('-night')>=0?t('cond_clear_night'):t('cond_clear_day');return t('cond_'+b);}
const HEROGRAD={
  'clear-day':'linear-gradient(135deg,#3E90E0 0%,#5FB0F2 45%,#FFC24B 100%)',
  'clear-night':'linear-gradient(135deg,#221A52 0%,#3A2E7A 55%,#5B4B9E 100%)',
  'pcloudy-day':'linear-gradient(135deg,#4E7FC7 0%,#7FA8DC 50%,#F2B54B 100%)',
  'pcloudy-night':'linear-gradient(135deg,#242058 0%,#40467F 60%,#6E6AA8 100%)',
  'cloudy':'linear-gradient(135deg,#6D6E93 0%,#9CA0BE 60%,#C3B7D6 100%)',
  'overcast':'linear-gradient(135deg,#5E6080 0%,#8A8DAB 100%)',
  'fog':'linear-gradient(135deg,#7C7E9C 0%,#B7BAD0 100%)',
  'rain':'linear-gradient(135deg,#3A4C7A 0%,#5C79B0 60%,#7E9BC9 100%)',
  'snow':'linear-gradient(135deg,#5B7BA6 0%,#9FC2E6 100%)',
  'thunder':'linear-gradient(135deg,#2A2350 0%,#4A3E7A 55%,#8B5CC7 100%)'
};
function heroGrad(k){return HEROGRAD[k]||HEROGRAD[k.replace('-day','').replace('-night','')]||'linear-gradient(135deg,#5B4B9E,#E4657F 70%,#FF9E5E)';}

/* ---- living sky background: time-of-day × condition (from the Sky Gradient Library) ---- */
const SKY={
  clear:{dawn:'linear-gradient(180deg,#20265e 0%,#6a5c9e 45%,#f2b17a 100%)',midday:'linear-gradient(180deg,#1f6fc4 0%,#4f9be0 50%,#bfe0f7 100%)',day:'linear-gradient(180deg,#2f7fd0 0%,#5aa6e6 55%,#a9d6f5 100%)',dusk:'linear-gradient(180deg,#1f2a5c 0%,#834f8f 50%,#f0913d 100%)',night:'linear-gradient(180deg,#0a0f26 0%,#161d47 55%,#282c5e 100%)'},
  pcloudy:{dawn:'linear-gradient(180deg,#39406f 0%,#7d7aa6 50%,#e6b58e 100%)',midday:'linear-gradient(180deg,#3d7cb0 0%,#6f9fc8 50%,#c2d8e8 100%)',day:'linear-gradient(180deg,#4a86bf 0%,#77a6cf 55%,#b6d2e6 100%)',dusk:'linear-gradient(180deg,#26305e 0%,#6f5788 50%,#d98a52 100%)',night:'linear-gradient(180deg,#10152f 0%,#232a54 55%,#3a406c 100%)'},
  cloudy:{dawn:'linear-gradient(180deg,#3c4160 0%,#7b7590 50%,#d0a487 100%)',day:'linear-gradient(180deg,#54607e 0%,#7c8aa4 55%,#a7b1c4 100%)',dusk:'linear-gradient(180deg,#2b3048 0%,#5f5872 50%,#c07f5c 100%)',night:'linear-gradient(180deg,#20263c 0%,#3a4258 60%,#525b72 100%)'},
  overcast:{dawn:'linear-gradient(180deg,#3a4054 0%,#6b6f82 55%,#b39079 100%)',day:'linear-gradient(180deg,#4a5266 0%,#6d7488 60%,#9098a8 100%)',dusk:'linear-gradient(180deg,#2c313f 0%,#585d6e 55%,#a67456 100%)',night:'linear-gradient(180deg,#191d2c 0%,#333a4c 100%)'},
  rain:{dawn:'linear-gradient(180deg,#333b54 0%,#5c6784 55%,#9c8b86 100%)',day:'linear-gradient(180deg,#39445e 0%,#5a6885 55%,#7f8ca6 100%)',dusk:'linear-gradient(180deg,#262d44 0%,#4a5673 55%,#8f6e6a 100%)',night:'linear-gradient(180deg,#141a2e 0%,#2b344c 60%,#414c66 100%)'},
  thunder:{dawn:'linear-gradient(180deg,#282b47 0%,#514f74 55%,#8a6f80 100%)',day:'linear-gradient(180deg,#2b2f4c 0%,#4a4a70 55%,#6f6790 100%)',dusk:'linear-gradient(180deg,#1c1d38 0%,#3f3c63 55%,#7a5566 100%)',night:'linear-gradient(180deg,#0f1024 0%,#26264a 60%,#403c66 100%)'},
  snow:{dawn:'linear-gradient(180deg,#4a597e 0%,#8f9fc4 50%,#e9d3d8 100%)',midday:'linear-gradient(180deg,#6f8bb8 0%,#a6c2de 55%,#e6f1fb 100%)',day:'linear-gradient(180deg,#6076a0 0%,#93aecd 55%,#cfe0f0 100%)',dusk:'linear-gradient(180deg,#3a4468 0%,#71749c 50%,#d0a0aa 100%)',night:'linear-gradient(180deg,#2a3550 0%,#4a5a7a 100%)'},
  fog:{dawn:'linear-gradient(180deg,#565e74 0%,#8f8f9e 55%,#cbb3a6 100%)',day:'linear-gradient(180deg,#606a80 0%,#8f97a9 55%,#c2c7d2 100%)',dusk:'linear-gradient(180deg,#42485a 0%,#77778a 55%,#b59180 100%)',night:'linear-gradient(180deg,#262b3a 0%,#474e60 100%)'}
};
function skyGrad(key,phase){const base=key.replace('-day','').replace('-night','');const set=SKY[base]||SKY.cloudy;return set[phase]||set.day||set.night||set[Object.keys(set)[0]];}
function skyPhase(key,hourMin,srMin,ssMin){
  const night=key.includes('-night')||(srMin!=null&&(hourMin<srMin-30||hourMin>ssMin+30));
  if(srMin==null||ssMin==null) return night?'night':'day';
  if(hourMin>=srMin-30&&hourMin<=srMin+60) return 'dawn';
  if(hourMin>=ssMin-60&&hourMin<=ssMin+30) return 'dusk';
  if(night) return 'night';
  const span=ssMin-srMin;
  if(span>0&&hourMin>=srMin+span*0.32&&hourMin<=ssMin-span*0.32) return 'midday';
  return 'day';
}

/* WMO code -> key (always carries -day/-night so night clouds can show a moon) */
function codeKey(code,isDay){
  const d=isDay?'-day':'-night';
  if(code===0||code===1) return 'clear'+d;
  if(code===2) return 'pcloudy'+d;
  if(code===3) return 'overcast'+d;
  if(code===45||code===48) return 'fog'+d;
  if(code>=51&&code<=67) return 'rain'+d;
  if(code>=71&&code<=77) return 'snow'+d;
  if(code>=80&&code<=82) return 'rain'+d;
  if(code>=85&&code<=86) return 'snow'+d;
  if(code>=95) return 'thunder'+d;
  return 'pcloudy'+d;
}

/* ============ LIVE FETCH (Open-Meteo, 7-model average) ============ */
async function fetchWeather(loc){
  const hv='temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,is_day,wind_speed_10m,dew_point_2m,cloud_cover';
  const dv='weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,uv_index_max';
  const ids=MODELS.map(m=>m.id).join(',');
  const cb='&_='+Date.now(); // cache-buster so pull-to-refresh always re-fetches (was hitting a ~15 min cache)
  const u1=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&timezone=auto&forecast_days=7&hourly=${hv}&daily=${dv}&models=${ids}`+cb;
  const u2=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&timezone=auto&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day,surface_pressure&hourly=surface_pressure&past_hours=3&forecast_hours=1&daily=uv_index_max,sunrise,sunset&forecast_days=1`+cb;
  const u3=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.lat}&longitude=${loc.lon}&timezone=auto&current=european_aqi,us_aqi,uv_index,alder_pollen,birch_pollen,olive_pollen,grass_pollen,mugwort_pollen,ragweed_pollen`+cb;
  const opt={cache:'no-store'};
  const [r1,r2,r3]=await Promise.all([fetch(u1,opt),fetch(u2,opt),fetch(u3,opt).catch(()=>null)]);
  const H=await r1.json(); const C=await r2.json();
  let AQ=null; try{ if(r3&&r3.ok) AQ=await r3.json(); }catch(e){}
  const hh=H.hourly, dd=H.daily, times=hh.time, n=times.length;
  const avg=(v,i)=>{const a=MODELS.map(m=>hh[v+'_'+m.id]&&hh[v+'_'+m.id][i]).filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;};
  const mode=(v,i)=>{const a=MODELS.map(m=>hh[v+'_'+m.id]&&hh[v+'_'+m.id][i]).filter(x=>x!=null);if(!a.length)return 0;const c={};let best=a[0],bn=0;a.forEach(x=>{c[x]=(c[x]||0)+1;if(c[x]>bn){bn=c[x];best=x;}});return best;};
  // start index = current local hour of the location
  const nowStr=(C.current&&C.current.time)?C.current.time.slice(0,13):new Date().toISOString().slice(0,13);
  let si=times.findIndex(t=>t.slice(0,13)===nowStr); if(si<0)si=0;
  const hourly=[];
  for(let i=si;i<Math.min(si+37,n);i++){
    const d=new Date(times[i]);const isDay=(avg('is_day',i)||0)>=0.5;const code=Math.round(mode('weather_code',i));
    const mmv=avg('precipitation',i);
    hourly.push({date:d,h:pad(d.getHours()),temp:R(avg('temperature_2m',i)),feels:R(avg('apparent_temperature',i)),
      precip:R(avg('precipitation_probability',i)),mm:mmv==null?0:Math.round(mmv*10)/10,wind:R(avg('wind_speed_10m',i)),key:codeKey(code,isDay),isDay,
      dew:R(avg('dew_point_2m',i)),cloud:R(avg('cloud_cover',i))});
  }
  // two hours before now, for a premium left lead-in on the hourly strip
  const past=[];
  for(let i=Math.max(0,si-2);i<si;i++){
    const d=new Date(times[i]);const isDay=(avg('is_day',i)||0)>=0.5;const code=Math.round(mode('weather_code',i));
    const mmv=avg('precipitation',i);
    past.push({date:d,h:pad(d.getHours()),temp:R(avg('temperature_2m',i)),feels:R(avg('apparent_temperature',i)),
      precip:R(avg('precipitation_probability',i)),mm:mmv==null?0:Math.round(mmv*10)/10,wind:R(avg('wind_speed_10m',i)),key:codeKey(code,isDay),isDay,
      dew:R(avg('dew_point_2m',i)),cloud:R(avg('cloud_cover',i)),past:true});
  }
  // daily averaged across models
  const davg=(v,i)=>{const a=MODELS.map(m=>dd[v+'_'+m.id]&&dd[v+'_'+m.id][i]).filter(x=>x!=null&&!isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;};
  const dmode=(v,i)=>{const a=MODELS.map(m=>dd[v+'_'+m.id]&&dd[v+'_'+m.id][i]).filter(x=>x!=null);if(!a.length)return 0;const c={};let b=a[0],bn=0;a.forEach(x=>{c[x]=(c[x]||0)+1;if(c[x]>bn){bn=c[x];b=x;}});return b;};
  const daily=[];
  for(let i=0;i<dd.time.length;i++){
    daily.push({date:new Date(dd.time[i]+'T12:00'),key:codeKey(Math.round(dmode('weather_code',i)),true),
      hi:R(davg('temperature_2m_max',i)),lo:R(davg('temperature_2m_min',i)),
      precip:R(davg('precipitation_probability_max',i)),wind:R(davg('wind_speed_10m_max',i))});
  }
  // per-model window hi/lo for source table
  const sources=MODELS.map(m=>{const arr=[];for(let i=si;i<Math.min(si+37,n);i++){const v=hh['temperature_2m_'+m.id]&&hh['temperature_2m_'+m.id][i];if(v!=null)arr.push(v);}return arr.length?{name:m.name,hi:Math.round(Math.max(...arr)),lo:Math.round(Math.min(...arr))}:null;}).filter(Boolean);
  // per-model precip disagreement over the next few days (the consensus edge)
  let rainSplit=null;
  for(let i=1;i<Math.min(4,dd.time.length);i++){
    const probs=MODELS.map(m=>dd['precipitation_probability_max_'+m.id]&&dd['precipitation_probability_max_'+m.id][i]).filter(x=>x!=null&&!isNaN(x));
    if(probs.length<3) continue;
    const spread=Math.max(...probs)-Math.min(...probs);
    const codes=MODELS.map(m=>dd['weather_code_'+m.id]&&dd['weather_code_'+m.id][i]).filter(x=>x!=null);
    const snowVotes=codes.filter(c=>(c>=71&&c<=77)||c===85||c===86).length;
    const snow=codes.length>0&&snowVotes*2>=codes.length;
    if(!rainSplit||spread>rainSplit.spread) rainSplit={dayIdx:i,spread:Math.round(spread),snow:snow};
  }
  const cur=C.current||{};
  // pressure trend from the last ~4 h of hourly surface_pressure (rising = fair, falling = unsettled)
  let ptrend=null;
  if(C.hourly&&C.hourly.surface_pressure){
    const pa=C.hourly.surface_pressure.filter(x=>x!=null&&!isNaN(x));
    if(pa.length>=2){const diff=pa[pa.length-1]-pa[0]; ptrend=diff>0.8?'up':diff<-0.8?'down':'steady';}
  }
  const sr=C.daily&&C.daily.sunrise?C.daily.sunrise[0].slice(11,16):'';
  const ss=C.daily&&C.daily.sunset?C.daily.sunset[0].slice(11,16):'';
  const aqc=(AQ&&AQ.current)||{};
  const num=v=>(v==null||isNaN(v))?null:v;
  const P=k=>num(aqc[k+'_pollen']);
  const pollen={alder:P('alder'),birch:P('birch'),grass:P('grass'),mugwort:P('mugwort'),olive:P('olive'),ragweed:P('ragweed')};
  const hasP=Object.keys(pollen).some(k=>pollen[k]!=null);
  const useUS=(loc.lon>=-170&&loc.lon<=-30); // Americas -> US AQI scale, elsewhere European
  const aqi=useUS?num(aqc.us_aqi):num(aqc.european_aqi), aqiScale=useUS?'us':'eu';
  const uvNow=num(aqc.uv_index)!=null?Math.round(aqc.uv_index):(C.daily&&C.daily.uv_index_max!=null?R(C.daily.uv_index_max[0]):null);
  const now0=hourly[0]||{}; // headline = the 7-model consensus, consistent with the rest of the card
  return {place:loc, tzOffset:H.utc_offset_seconds||0,
    current:{temp: now0.temp!=null?now0.temp:R(cur.temperature_2m),
      feels: now0.feels!=null?now0.feels:R(cur.apparent_temperature),
      key: now0.key||codeKey(cur.weather_code||0, cur.is_day===undefined?true:cur.is_day>=0.5),
      humidity:R(cur.relative_humidity_2m), wind: now0.wind!=null?now0.wind:R(cur.wind_speed_10m),
      uv:uvNow, sunrise:sr, sunset:ss, pressure:cur.surface_pressure!=null?Math.round(cur.surface_pressure):null, pressureTrend:ptrend,
      dew: now0.dew!=null?now0.dew:null, cloud: now0.cloud!=null?now0.cloud:null},
    hourly,daily,sources,rainSplit,past,pollen:hasP?pollen:null,aqi:aqi,aqiScale:aqiScale,live:true,updated:(cur.time||'').slice(11,16)};
}

/* ============ SUN & MOON (trimmed SunCalc — MIT, V. Agafonkin) ============ */
const SC=(function(){
  const PI=Math.PI, rad=PI/180, dayMs=86400000, J1970=2440588, J2000=2451545, e=rad*23.4397;
  const toDays=date=>date.valueOf()/dayMs-0.5+J1970-J2000;
  const ra=(l,b)=>Math.atan2(Math.sin(l)*Math.cos(e)-Math.tan(b)*Math.sin(e),Math.cos(l));
  const dec=(l,b)=>Math.asin(Math.sin(b)*Math.cos(e)+Math.cos(b)*Math.sin(e)*Math.sin(l));
  const sidereal=(d,lw)=>rad*(280.16+360.9856235*d)-lw;
  const altitude=(H,phi,d)=>Math.asin(Math.sin(phi)*Math.sin(d)+Math.cos(phi)*Math.cos(d)*Math.cos(H));
  const solarMeanAnomaly=d=>rad*(357.5291+0.98560028*d);
  const eclipticLongitude=M=>{const C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));return M+C+rad*102.9372+PI;};
  const sunCoords=d=>{const M=solarMeanAnomaly(d),L=eclipticLongitude(M);return {dec:dec(L,0),ra:ra(L,0)};};
  const moonCoords=d=>{const L=rad*(218.316+13.176396*d),M=rad*(134.963+13.064993*d),F=rad*(93.272+13.229350*d);
    const l=L+rad*6.289*Math.sin(M),b=rad*5.128*Math.sin(F),dt=385001-20905*Math.cos(M);

function buildTips(D){
  const c=D.current, hrs=D.hourly||[];
  const next24=hrs.slice(0,24);
  const pmax=Math.max(0,...next24.map(x=>x.precip==null?0:x.precip));
  const uv=+c.uv||0, hum=c.humidity||0;
  const tp=(c.temp==null?null:c.temp), fl=(c.feels==null?tp:c.feels), wind=c.wind||0;
  const dew=(c.dew==null?null:c.dew), cloud=(c.cloud==null?null:c.cloud);
  const aqi=D.aqi, us=D.aqiScale==='us';
  const night=(c.key||'').indexOf('-night')>=0;
  const nowH=new Date().getHours();
  const T=[];

  // — Pollen: name the culprit —
  if(D.pollen){
    let bk=null,bi=-1;
    Object.keys(D.pollen).forEach(k=>{const lv=pollenLevel(k,D.pollen[k]).i; if(lv>bi){bi=lv;bk=k;}});
    const name=bk?t('p_'+bk):'';
    if(bi>=4) T.push({ic:'flower',tx:tf('tip_pollen_vhigh',{name}),pri:100});
    else if(bi===3) T.push({ic:'flower',tx:tf('tip_pollen_high',{name}),pri:90});
    else if(bi===2) T.push({ic:'flower',tx:tf('tip_pollen_mod',{name}),pri:45});
    else if(bi>=0) T.push({ic:'flower',tx:t('tip_pollen_low'),pri:12});
  }

  // — UV: tie advice to the number —
  if(uv>=8) T.push({ic:'lotion',tx:t('tip_uv_vhigh'),pri:95});
  else if(uv>=6) T.push({ic:'lotion',tx:t('tip_uv_high'),pri:80});
  else if(uv>=3) T.push({ic:'lotion',tx:t('tip_uv_mod'),pri:42});
  else if(uv>=1) T.push({ic:'lotion',tx:t('tip_uv_low'),pri:14});

  // — Air quality —
  if(aqi!=null){
    if(us?aqi>100:aqi>80) T.push({ic:'mask',tx:t('tip_air_poor'),pri:88});
    else if(us?aqi>50:aqi>40) T.push({ic:'mask',tx:t('tip_air_fair'),pri:30});
    else T.push({ic:'mask',tx:t('tip_air_clean'),pri:26});
  }

  // — Dew point / humidity —
  if(dew!=null){
    if(dew>=18) T.push({ic:'muggy',tx:t('tip_dew_muggy'),pri:58});
    else if(dew<=2||hum<=35) T.push({ic:'dryair',tx:t('tip_dew_dry'),pri:38});
  }

  // — What to wear: feels-like + wind —
  (function(){
    if(fl==null){T.push({ic:'tshirt',tx:t('tip_cloth_comfort'),pri:22});return;}
    if(wind>=22&&fl<20){T.push({ic:'wind',tx:t('tip_cloth_wind'),pri:56});return;}
    if(fl>=27) T.push({ic:'undershirt',tx:t('tip_cloth_light'),pri:fl>=32?70:26});
    else if(fl>=18) T.push({ic:'tshirt',tx:t('tip_cloth_comfort'),pri:22});
    else if(fl>=10) T.push({ic:'hoodie',tx:t('tip_cloth_layers'),pri:28});
    else if(fl>=2) T.push({ic:'jacket',tx:t('tip_cloth_warm'),pri:48});
    else T.push({ic:'glove',tx:t('tip_cloth_warm'),pri:75});
  })();

  // — Best window today / evening cool-off —
  (function(){
    const win=hrs.slice(0,14).filter(x=>x.temp!=null);
    if(!win.length) return;
    let warm=win[0]; win.forEach(x=>{if(x.temp>warm.temp)warm=x;});
    let coolH=null;
    for(let i=1;i<win.length;i++){ if(win[i].date.getHours()>=18&&(warm.temp-win[i].temp)>=5){coolH=win[i].date.getHours();break;} }
    if(coolH!=null){ T.push({ic:'hoodie',tx:tf('tip_window_cool',{h:pad(coolH)+':00'}),pri:60}); }
    else { const wh=warm.date.getHours(); T.push({ic:'warmtime',tx:tf('tip_window_warm',{a:pad(wh)+':00',b:pad((wh+2)%24)+':00',t:tC(Math.round(warm.temp))+'°'}),pri:50}); }
  })();

  // — Rain timing —
  (function(){
    const soon=hrs.slice(0,12).find(x=>x.precip!=null&&x.precip>=50);
    if(soon) T.push({ic:'rain',tx:tf('tip_rain_soon',{h:pad(soon.date.getHours())+':00'}),pri:85});
    else if(pmax<15) T.push({ic:'dryeve',tx:t('tip_rain_dry'),pri:20});
  })();

  // — Car wash: gate on rain —
  T.push(pmax>=40?{ic:'car',tx:t('tip_car_no'),pri:62}:{ic:'car',tx:t('tip_car_yes'),pri:28});

  // — Outdoor workout: combined call —
  (function(){
    const airOk=aqi==null||(us?aqi<=100:aqi<=80);
    const good=pmax<30&&tp!=null&&tp>=8&&tp<=26&&airOk&&uv<9&&wind<35;
    T.push(good?{ic:'run',tx:t('tip_run_yes'),pri:50}:{ic:'run',tx:t('tip_run_no'),pri:44});
  })();

  // — Gardening / laundry line —
  if(hum<=55&&pmax<15&&wind>=5&&wind<=30&&tp!=null&&tp>=10) T.push({ic:'can',tx:t('tip_garden_yes'),pri:40});

  // — Stargazing: tonight's cloud + moon —
  if(night||nowH>=18){
    let cc=cloud;
    if(cc==null){const ev=hrs.slice(0,6).map(x=>x.cloud).filter(v=>v!=null); if(ev.length) cc=ev.reduce((a,b)=>a+b,0)/ev.length;}
    let illum=null; try{illum=moonBlock(D.place.lat,D.place.lon,D.tzOffset).illum;}catch(e){}
    if(cc!=null&&cc<=30) T.push({ic:'stars',tx:tf('tip_star_yes',{n:(illum==null?'—':illum)}),pri:46});
    else if(cc!=null&&cc>=70) T.push({ic:'cloud',tx:t('tip_star_no'),pri:24});
  }

  // — Golden hour / photography —
  if(c.sunset){ const p=c.sunset.split(':'); let m=(+p[0])*60+(+p[1])-40; if(m<0)m+=1440; T.push({ic:'goldenhour',tx:tf('tip_golden',{h:pad(Math.floor(m/60))+':'+pad(m%60)}),pri:30}); }

  // — Mosquitoes —
  if(tp!=null&&tp>=18&&hum>=60&&wind<12) T.push({ic:'bug',tx:t('tip_mosq_yes'),pri:52});
  else T.push({ic:'bug',tx:t('tip_mosq_no'),pri:16});

  // — Consensus edge: honest uncertainty —
  const cap1=w=>w?w.charAt(0).toUpperCase()+w.slice(1):w;
  if(D.rainSplit&&D.rainSplit.spread>=40){
    const rs=D.rainSplit, dd2=D.daily&&D.daily[rs.dayIdx];
    const day=(dd2&&dd2.date)?cap1(dd2.date.toLocaleDateString(LANG,{weekday:'long'})):'';
    T.push({ic:'alert',tx:tf(rs.snow?'tip_cons_snow':'tip_cons_rain',{day}),pri:78});
  } else if(D.sources&&D.sources.length>=3){
    const his=D.sources.map(s=>s.hi), los=D.sources.map(s=>s.lo);
    const spread=Math.max(Math.max(...his)-Math.min(...his), Math.max(...los)-Math.min(...los));
    if(spread>5) T.push({ic:'alert',tx:t('tip_cons_diverge'),pri:72});
  }

  // rank by relevance, keep an even 8–12
  T.sort((a,b)=>b.pri-a.pri);
  let n=Math.min(12,T.length); if(n<8) n=T.length; n=n-(n%2);
  return T.slice(0,n);
}

/* ---- segments ---- */
function buildSegments(hourly){
  const groups=[];let last=null;
  hourly.forEach(it=>{const p=partOf(it.date.getHours());const dk=it.date.toDateString()+'|'+p;
    if(!last||last.dk!==dk){last={dk,part:p,date:it.date,items:[]};groups.push(last);}last.items.push(it);});
  return groups.slice(0,8).map((g,gi)=>{
    const temps=g.items.map(x=>x.temp).filter(v=>v!=null),feels=g.items.map(x=>x.feels).filter(v=>v!=null);
    const hi=temps.length?Math.max(...temps):null,lo=temps.length?Math.min(...temps):null;
    const fav=feels.length?Math.round(feels.reduce((a,b)=>a+b,0)/feels.length):null;
    const cc={};let key=g.items[0].key,bn=0;g.items.forEach(x=>{cc[x.key]=(cc[x.key]||0)+1;if(cc[x.key]>bn){bn=cc[x.key];key=x.key;}});
    const pv=g.items.map(x=>x.precip).filter(v=>v!=null),wv=g.items.map(x=>x.wind).filter(v=>v!=null);
    const precip=pv.length?Math.max(...pv):0,wind=wv.length?Math.max(...wv):0;
    const pw={Morning:t('seg_morning'),Afternoon:t('seg_afternoon'),Evening:t('seg_evening'),Night:t('seg_night')};
    const cap1=w=>w?w.charAt(0).toUpperCase()+w.slice(1):w;
    let dayLong=cap1(g.date.toLocaleDateString(LANG,{weekday:'long'}));
    let name=dayLong+' '+cap1(pw[g.part]||g.part);
    if(gi===0){name=g.part==='Evening'?t('seg_thisEvening'):g.part==='Night'?t('seg_overnight'):g.part==='Morning'?t('seg_thisMorning'):t('seg_thisAfternoon');}
    if(gi>0&&g.part==='Night')name=dayLong+' '+cap1(t('seg_night'));
    const h0=g.items[0].date.getHours(),h1=(g.items[g.items.length-1].date.getHours()+1)%24;
    return {name,time:pad(h0)+':00–'+pad(h1)+':00',hi,lo,feels:fav,key,desc:narr(key,hi,lo,precip,wind)};
  });
}
function narr(key,hi,lo,precip,wind){
  const cond=LB(key)||t('n_mixed');
  if(hi==null) return cond+'. '+t('n_nodata');
  let s=cond+'. '+t('n_around')+' '+tC(hi)+'°'+(lo!=null&&hi-lo>=3?', '+t('n_downto')+' '+tC(lo)+'°':'')+'. ';
  var snowy=(key&&key.indexOf('snow')>=0);
  s+=precip>=40?t(snowy?'n_snowGood':'n_rainGood')+' ('+precip+'%). ':precip>=15?t(snowy?'n_snowSlight':'n_rainSlight')+' ('+precip+'%). ':t('n_dry')+' ';
  s+=wind>=25?t('n_breezy'):t('n_light');return s;
}

/* ---- SVG line chart ---- */
function svgChart(items,viewW){
  const n=items.length,H=210,pL=34,pR=32,pT=16,pB=42;
  const per=(Math.max(viewW||360,280)-pL-pR)/17; // ~18 hours fit the visible width
  const W=pL+pR+per*(n-1);
  const temp=coalesce(items.map(x=>tC(x.temp))),feels=coalesce(items.map(x=>tC(x.feels))),rain=items.map(x=>x.precip==null?0:x.precip);
  const tmin=Math.min(...temp,...feels),tmax=Math.max(...temp,...feels);
  const lo=Math.floor((tmin-1)/2)*2,hi=Math.ceil((tmax+1)/2)*2;
  const X=i=>pL+per*i, Y=v=>pT+(H-pT-pB)*(1-(v-lo)/(hi-lo||1));
  const smooth=arr=>{let d='M'+X(0)+' '+Y(arr[0]);for(let i=0;i<n-1;i++){const x0=X(i),y0=Y(arr[i]),x1=X(i+1),y1=Y(arr[i+1]);const cx=(x0+x1)/2;d+=' C'+cx+' '+y0+' '+cx+' '+y1+' '+x1+' '+y1;}return d;};
  let grid='';for(let v=lo;v<=hi;v+=Math.max(2,Math.round((hi-lo)/6/2)*2)){grid+=`<line x1="${pL}" y1="${Y(v)}" x2="${W-pR}" y2="${Y(v)}" stroke="rgba(255,255,255,.09)" stroke-width="1"/><text x="${pL-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" font-weight="700" fill="#A9A2C9">${v}°</text><text x="${W-pR+6}" y="${Y(v)+4}" text-anchor="start" font-size="11" font-weight="700" fill="#A9A2C9">${v}°</text>`;}
  const rmax=H-pB, rh=v=>(v/100)*((H-pT-pB)*0.55);
  let bars='';const bw=(W-pL-pR)/n*0.6;items.forEach((x,i)=>{if(x.precip>0){bars+=`<rect x="${X(i)-bw/2}" y="${rmax-rh(x.precip)}" width="${bw}" height="${rh(x.precip)}" rx="2" fill="#5AB0F0" opacity=".38"/>`;}});
  let xlab='';items.forEach((x,i)=>{const hh=x.date.getHours();if(hh%3===0){xlab+=`<text x="${X(i)}" y="${H-pB+20}" text-anchor="middle" font-size="11" font-weight="700" fill="#A9A2C9">${pad(hh)}</text>`;if(hh===0)xlab+=`<text x="${X(i)}" y="${H-pB+34}" text-anchor="middle" font-size="10" font-weight="800" fill="#A78BFF">${WD[x.date.getDay()]}</text>`;}});
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${grid}${bars}
    <path d="${smooth(feels)}" fill="none" stroke="#A78BFF" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${smooth(temp)}" fill="none" stroke="#FF9E5A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${xlab}</svg>`;
}
let LAST_HOURLY=null;
function drawChart(items, box, keep){
  if(keep!==false)LAST_HOURLY=items;
  box=box||document.getElementById('chartBox'); if(!box)return;
  box.innerHTML=svgChart(items, box.clientWidth||360);
}

const LKEY='cw_locs_v3', AKEY='cw_active_v3', MAX_LOC=10;

function loadLocs(){

}

function renderTiles(scope,ai){

function openManage(){renderLocList();document.getElementById('sheet').classList.add('open');setRefresh(false);}
async function loadActive(silent,dir){
  const loc=LOCS[ACTIVE]||LOCS[0]; if(!loc)return; renderTiles(); saveLocs();
  const key=ckey(loc), cached=WCACHE[key];
  if(cached){ render(cached.D); animateApp(dir); prefetchNeighbors();
    if(Date.now()-cached.t>600000) refreshLoc(loc,key); return; }
  if(!silent)document.getElementById('app').innerHTML='<div class="loading"><span class="spin"></span>'+tf('loadingCity',{city:loc.name})+'</div>';
  try{const D=await fetchWeather(loc);WCACHE[key]={D:D,t:Date.now()};if(!isActive(loc))return;render(D);animateApp(dir);prefetchNeighbors();}
  catch(e){ if(loc.name==='Gliwice'){render(buildFallback());}
    else if(!silent){document.getElementById('app').innerHTML='<div class="loading">'+t('cantReach')+'<br><small style="font-weight:600">'+t('cantReachSub')+'</small></div>';} }
}
const WCACHE={};
function ckey(loc){return (+loc.lat).toFixed(3)+','+(+loc.lon).toFixed(3);}
function isActive(loc){const cur=LOCS[ACTIVE]||LOCS[0];return cur&&ckey(cur)===ckey(loc);}
function animateApp(dir){var a=document.getElementById('app');if(!a)return;a.classList.remove('app-next','app-prev','app-fade');void a.offsetWidth;a.classList.add(dir==='next'?'app-next':dir==='prev'?'app-prev':'app-fade');}
function prefetchNeighbors(){var n=LOCS.length;if(n<2)return;[(ACTIVE+1)%n,(ACTIVE-1+n)%n].forEach(function(i){var loc=LOCS[i];if(!loc)return;var k=ckey(loc);if(WCACHE[k])return;fetchWeather(loc).then(function(D){WCACHE[k]={D:D,t:Date.now()};}).catch(function(){});});}
function refreshLoc(loc,key){fetchWeather(loc).then(function(D){WCACHE[key]={D:D,t:Date.now()};if(isActive(loc))render(D);}).catch(function(){});}
function spinLogo(el){var b=el&&el.querySelector('.logo-badge');if(!b)return;b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');setTimeout(function(){b.classList.remove('spin');},720);}
window.refreshWeather=async function(){

window.onDeviceLocation=async function(lat,lon){

/* while dragging a horizontal rail, disable pull-to-refresh so sideways scroll never triggers it */
let _sx=0,_sy=0,_st=null;
let DRAG={active:false,dir:0,w:0,dx:0,ghost:null};
let _raf=0,_pdx=0,_vx=0,_vt=0,_pvx=0,_pvt=0;
function _applyDrag(){_raf=0;if(!DRAG.active)return;const app=document.getElementById('app');const d=_pdx;app.style.transform='translate3d('+d+'px,0,0)';if(DRAG.ghost)DRAG.ghost.style.transform='translate3d('+(DRAG.dir*DRAG.w+d)+'px,0,0)';}
document.addEventListener('touchstart',e=>{const t=e.touches[0];_sx=t.clientX;_sy=t.clientY;_st=e.target;DRAG.active=false;if(e.target&&e.target.closest&&e.target.closest('.locbar,.strip,.chart-box'))setRefresh(false);},{passive:true});
document.addEventListener('touchmove',e=>{
  if(document.querySelector('.sheet.open'))return;
  if(_st&&_st.closest&&_st.closest('.strip,.chart-box'))return; // let those scroll horizontally
  if(LOCS.length<2)return;
  const t=e.touches[0],dx=t.clientX-_sx,dy=t.clientY-_sy;
  if(!DRAG.active){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){
      const dir=dx<0?1:-1,n=LOCS.length,ni=dir>0?(ACTIVE+1)%n:(ACTIVE-1+n)%n,loc=LOCS[ni],cached=loc&&WCACHE[ckey(loc)];
      if(!cached)return; // neighbour not cached yet → let touchend do a plain flip
      const app=document.getElementById('app');
      DRAG.active=true;DRAG.dir=dir;DRAG.w=app.offsetWidth+28;

function saveNotifCfg(){
  NOTIF=NOTIFCFG.enabled;
  try{localStorage.setItem('cw_notif',JSON.stringify(NOTIFCFG));}catch(e){}
  try{if(window.AndroidBridge&&AndroidBridge.setNotifConfig)AndroidBridge.setNotifConfig(JSON.stringify(NOTIFCFG));}catch(e){}
  try{if(window.AndroidBridge&&AndroidBridge.setNotifications)AndroidBridge.setNotifications(NOTIFCFG.enabled);}catch(e){}
  if(NOTIFCFG.enabled)pushNotifStrings();
  var b=document.getElementById('notifBtn');if(b){b.innerHTML=icoBell(NOTIF);b.classList.toggle('off',!NOTIF);}
}
function nsw(on,fn){return '<button class="nsw'+(on?' on':'')+'" onclick="'+fn+'()" aria-label="toggle"><span></span></button>';}
function renderNotifSheet(){
  var box=document.getElementById('notifBody'); if(!box)return;
  var c=NOTIFCFG, N=NUI[LANG]||NUI.en;
  document.getElementById('notifSheetTitle').textContent=N.title;
  var freq=[1,2,3].map(function(k){return '<button class="segbtn'+(c.times.length===k?' on':'')+'" onclick="setNotifCount('+k+')">'+k+'×</button>';}).join('');
  var times=c.times.map(function(tm,i){return '<div class="ntime">'+IC('clock')+'<input type="time" value="'+tm+'" onchange="setNotifTime('+i+',this.value)"></div>';}).join('');
  box.innerHTML=
    '<div class="nrow"><span class="nlbl">'+N.title+'</span>'+nsw(c.enabled,'setNotifEnabled')+'</div>'+
    '<div class="nsub"'+(c.enabled?'':' style="opacity:.4;pointer-events:none"')+'>'+
      '<div class="nrow"><span class="nlbl">'+N.perDay+'</span><div class="seg">'+freq+'</div></div>'+
      '<div class="ntimes">'+times+'</div>'+
      '<div class="nrow"><span class="nlbl">'+N.severe+'<em>'+N.severeSub+'</em></span>'+nsw(c.severe,'setNotifSevere')+'</div>'+
    '</div>';
}
function setNotifEnabled(){NOTIFCFG.enabled=!NOTIFCFG.enabled;saveNotifCfg();renderNotifSheet();}
function setNotifSevere(){NOTIFCFG.severe=!NOTIFCFG.severe;saveNotifCfg();renderNotifSheet();}
function setNotifCount(n){var P={1:["08:00"],2:["07:00","19:00"],3:["07:00","13:00","19:00"]};NOTIFCFG.times=(P[n]||P[2]).slice();saveNotifCfg();renderNotifSheet();}
function setNotifTime(i,val){if(!val)return;NOTIFCFG.times[i]=val;saveNotifCfg();}
function openNotifSheet(){renderNotifSheet();document.getElementById('notifSheet').classList.add('open');setRefresh(false);}
function closeNotifSheet(){document.getElementById('notifSheet').classList.remove('open');setRefresh(true);}
function renderLangList(){
  var box=document.getElementById('langList'); if(!box)return;
  box.innerHTML=Object.keys(LANG_NAMES).sort(function(a,b){return (LANG_EN[a]||a).localeCompare(LANG_EN[b]||b);}).map(function(code){
    var en=LANG_EN[code]||code,nat=LANG_NAMES[code],label=(nat&&nat!==en)?en+' / '+nat:en;
    return '<div class="locitem'+(code===LANG?' on':'')+'" onclick="setLang(\''+code+'\')"><span>'+label+'</span>'+(code===LANG?'<em>✓</em>':'')+'</div>';
  }).join('');
}
function openLangSheet(){renderLangList();document.getElementById('langSheet').classList.add('open');setRefresh(false);}
function closeLangSheet(){var s=document.getElementById('langSheet');if(s)s.classList.remove('open');setRefresh(true);}
document.getElementById('langSheet').addEventListener('click',e=>{if(e.target.id==='langSheet')closeLangSheet();});

document.documentElement.dir=RTL_LANGS.indexOf(LANG)>=0?'rtl':'ltr';
applyStaticI18n();
renderTiles();
(function(){
  const gi=gpsIndex();
  if(gi>=0)ACTIVE=gi; else {let a=0;try{a=parseInt(localStorage.getItem(AKEY)||'0',10);}catch(e){}ACTIVE=Math.min(Math.max(a||0,0),LOCS.length-1);}
  renderTiles(); loadActive();
  try{if(window.AndroidBridge&&AndroidBridge.setNotifConfig)AndroidBridge.setNotifConfig(JSON.stringify(NOTIFCFG));}catch(e){}
  try{if(window.AndroidBridge&&AndroidBridge.setNotifications)AndroidBridge.setNotifications(NOTIF);}catch(e){}
  pushNotifStrings();
  if((window.AndroidBridge&&AndroidBridge.requestLocation)||navigator.geolocation) useMyLocation(true);
})();
