name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

            - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Read version from build.gradle
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ConsensusWeather-v${{ steps.version.outputs.name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConsensusWeather-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/ConsensusWeather-v${{ steps.version.outputs.name }}.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Consensus Weather v${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/debug/ConsensusWeather-v${{ steps.version.outputs.name }}.apk
          body: |
            Auto-built debug APK. Download **ConsensusWeather-v${{ steps.version.outputs.name }}.apk** below and install it on your phone.
