name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'screenshots/**'
      - 'tools/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # the version, release name and APK file name all come from versionName in app/build.gradle
      - name: Read version
        id: ver
        run: echo "name=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Consensus_Weather_v${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Consensus_Weather-v${{ steps.ver.outputs.name }}-apk
          path: Consensus_Weather_v${{ steps.ver.outputs.name }}.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Consensus Weather v${{ steps.ver.outputs.name }}
          files: Consensus_Weather_v${{ steps.ver.outputs.name }}.apk
          make_latest: true
          body: |
            Download **Consensus_Weather_v${{ steps.ver.outputs.name }}.apk** below and open it on your phone to install.
